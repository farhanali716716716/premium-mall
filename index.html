<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhan Premium Mall</title>
    <!-- Font Awesome Icon Library -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-deep: #05070f;
            --bg-surface: #0f1322;
            --gold-glow: #fbbf24;
            --gold-dark: #b45309;
            --text-light: #f8fafc;
            --text-gray: #94a3b8;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: var(--bg-deep); color: var(--text-light); -webkit-font-smoothing: antialiased; }
        
        /* High-End Header Styling */
        header { background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-deep) 100%); padding: 25px 20px; border-bottom: 1px solid #1e293b; text-align: center; }
        .mall-logo { width: 50px; height: 50px; background: rgba(251,191,36,0.1); border: 1px solid var(--gold-glow); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold-glow); font-size: 22px; margin: 0 auto 10px auto; box-shadow: 0 0 15px rgba(251,191,36,0.2); }
        header h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
        header p { margin: 5px 0 0 0; font-size: 13px; color: var(--text-gray); }

        /* Premium Top Banner */
        .hero-showcase { text-align: center; padding: 30px 15px; background: radial-gradient(circle at center, #1e1b4b 0%, var(--bg-deep) 100%); border-bottom: 1px solid #111827; }
        .badge-premium { background: rgba(251,191,36,0.08); color: var(--gold-glow); padding: 5px 14px; border-radius: 30px; font-size: 11px; font-weight: 700; border: 1px solid rgba(251,191,36,0.2); display: inline-block; text-transform: uppercase; letter-spacing: 1px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* Luxury Double Grid System */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 15px; }
        .card { background: var(--bg-surface); border-radius: 20px; border: 1px solid #1e293b; padding: 20px; display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .card:hover { transform: translateY(-5px); border-color: var(--gold-glow); box-shadow: 0 10px 25px rgba(251,191,36,0.15); }
        
        .card .stock-tag { position: absolute; top: 15px; right: 15px; background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.2); padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .card-icon-box { width: 100%; height: 140px; background: #05070f; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; border: 1px solid #1e293b; }
        .card-icon-box i { font-size: 45px; color: #334155; }
        
        .card h3 { margin: 0; font-size: 19px; font-weight: 700; color: #fff; text-align: left; }
        .card .pricing-row { display: flex; align-items: baseline; gap: 8px; margin: 12px 0; }
        .card .price-now { color: var(--gold-glow); font-size: 24px; font-weight: 800; }
        .card .price-was { color: #475569; font-size: 14px; text-decoration: line-through; }
        
        /* Modernized Checkout Trigger Button */
        .card .purchase-btn { background: linear-gradient(135deg, var(--gold-glow), #f59e0b); color: #000; border: none; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
        .card .purchase-btn:hover { opacity: 0.9; }

        /* Slide-up App Drawer Sheet Modal Styling */
        .checkout-drawer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; align-items: flex-end; justify-content: center; }
        .drawer-content { background: #0c0f1d; border-top-left-radius: 28px; border-top-right-radius: 28px; width: 100%; max-width: 500px; padding: 25px; box-sizing: border-box; border-top: 1px solid #1e293b; max-height: 85vh; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .drawer-title { font-size: 18px; font-weight: 700; color: #fff; margin: 0; }
        .drawer-close { font-size: 22px; color: var(--text-gray); cursor: pointer; }
        
        .item-preview { background: var(--bg-surface); border-radius: 14px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #1e293b; margin-bottom: 20px; }
        .preview-title { font-weight: 600; color: #fff; font-size: 15px; }
        .preview-cost { color: var(--gold-glow); font-size: 15px; font-weight: 700; margin-top: 2px; }
        
        /* Clean Input Wrapper Styles */
        input, textarea { width: 100%; padding: 14px; margin-bottom: 15px; background: #05070f; color: white; border: 1px solid #1e293b; border-radius: 12px; box-sizing: border-box; font-size: 14px; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: var(--gold-glow); outline: none; }
        
        .drawer-total { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 600; margin: 20px 0; border-top: 1px solid #1e293b; padding-top: 15px; }
        
        /* Direct Action Universal Button */
        .submit-invoice-btn { background: linear-gradient(135deg, #15803d, #16a34a); color: white; border: none; padding: 15px; width: 100%; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; text-transform: uppercase; text-align: center; display: block; text-decoration: none; box-shadow: 0 4px 15px rgba(22,163,74,0.3); }

        /* Floating Fixed Side Bubble Elements */
        .floating-whatsapp { position: fixed; bottom: 20px; right: 20px; background-color: #10b981; color: white; width: 55px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 999999; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    </style>
</head>
