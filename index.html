<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farhan Premium Store</title>
    <!-- Official Font Awesome Icon Library Framework -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-card: #111216;
            --accent: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-main); }
        header { background-color: var(--bg-card); padding: 15px 20px; border-bottom: 1px solid #1f2937; display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 40px; height: 40px; background-color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 20px; font-weight: bold; }
        .header-title-box { text-align: left; }
        .header-title { font-size: 16px; font-weight: bold; color: #fff; margin: 0; }
        .header-subtitle { font-size: 12px; color: var(--text-muted); margin: 2px 0 0 0; }
        .hero-banner { text-align: center; padding: 40px 20px; background: radial-gradient(circle at center, #1e1b4b 0%, var(--bg-main) 100%); }
        .hero-title { font-size: 32px; font-weight: 800; margin: 10px 0; color: #fff; }
        .hero-desc { font-size: 15px; color: var(--text-muted); max-width: 600px; margin: 0 auto; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--bg-card); border-radius: 16px; border: 1px solid #1f2937; padding: 20px; display: flex; flex-direction: column; }
        .price-current { color: var(--accent); font-size: 26px; font-weight: 700; margin: 10px 0; }
        .order-now-btn { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; width: 100%; margin-top: auto; }
        .checkout-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; align-items: flex-end; justify-content: center; }
        .modal-content { background: #16171d; border-top-left-radius: 24px; border-top-right-radius: 24px; width: 100%; max-width: 550px; padding: 25px; box-sizing: border-box; border-top: 1px solid #2d3139; max-height: 90vh; overflow-y: auto; }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 16px; background: #0a0a0c; color: white; border: 1px solid #2d3139; border-radius: 10px; box-sizing: border-box; font-size: 14px; }
        .receipt-btn { background: #b45309; color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; text-align: center; display: block; box-sizing: border-box; text-decoration: none; box-shadow: 0 4px 12px rgba(180,83,9,0.2); }
        
        /* 🟢 Permanent Static Floating WhatsApp Action Style */
        .floating-whatsapp { position: fixed; bottom: 20px; right: 20px; background-color: #10b981; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; z-index: 999999; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <header>
        <div class="header-logo"><i class="fa fa-shopping-bag"></i></div>
        <div class="header-title-box"><h1 class="header-title">Farhan Premium Store</h1><p class="header-subtitle">Premium electronics & essentials</p></div>
    </header>
    <section class="hero-banner">
        <h2 class="hero-title">Shop premium, order in seconds</h2>
        <p class="hero-desc">Confirm instantly on WhatsApp with an auto-generated receipt.</p>
    </section>
    <div class="container"><div class="grid" id="catalog-holder"></div></div>
    
    <div class="checkout-modal" id="receiptModal">
        <div class="modal-content">
            <h3 id="modal-name" style="color:#fff; margin-top:0;">Checkout</h3>
            <form onsubmit="dispatchInvoice(event); return false;">
                <input type="text" id="c-name" required placeholder="Full name (e.g. Ali Khan)">
                <input type="tel" id="c-phone" required placeholder="Phone number (e.g. 0300 1234567)">
                <textarea id="c-addr" rows="2" required placeholder="House, street, city"></textarea>
                <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-weight:bold;"><span>Total</span><span style="color:var(--accent);" id="modal-total">Rs. 1,000</span></div>
                
                <button type="submit" id="submit-receipt-trigger" class="receipt-btn">Confirm Order on WhatsApp 🚀</button>
            </form>
        </div>
    </div>

    <!-- 🟢 FIXED NATIVE APPLICATION INTERACTION LINK - NO MORE QUESTIONS -->
    <a href="whatsapp://send?phone=923121545628" class="floating-whatsapp"><i class="fa fa-whatsapp"></i></a>

    <script>
        const gadgets = ["Cloth Material", "iPhone 15 Pro Max", "MacBook Pro M3", "Smartwatch Ultra 2", "Wireless Pro Earbuds"];
        let catalogHtml = "";
        for (let i = 1; i <= 100; i++) {
            let name = gadgets[(i-1)%gadgets.length] + " (#" + i + ")";
            let price = 25000 + (i * 1200);
            catalogHtml += `<div class="card">
                <img src="https://unsplash.com" style="width:100%; height:180px; object-fit:cover; border-radius:10px;">
                <h3 style="text-align:left; margin-top:15px;">${name}</h3>
                <div class="price-current" style="text-align:left;">Rs. ${price.toLocaleString()}</div>
                <button class="order-now-btn" onclick="triggerCheckout('${name}', ${price})">Order Now</button>
            </div>`;
        }
        document.getElementById('catalog-holder').innerHTML = catalogHtml;

        let selectedItem = null;
        function triggerCheckout(name, price) {
            selectedItem = { name, price };
            document.getElementById('modal-name').innerText = "Checkout: " + name;
            document.getElementById('modal-total').innerText = "Rs. " + price.toLocaleString();
            document.getElementById('receiptModal').style.display = 'flex';
        }

        function dispatchInvoice(e) {
            e.preventDefault();
            let n = document.getElementById('c-name').value.trim();
            let p = document.getElementById('c-phone').value.trim();
            let a = document.getElementById('c-addr').value.trim();
            
            if (!n || !p || !a) return alert("Saari details bharein!");
            
            let txt = '*🔥 NEW FARHAN STORE ORDER!*%0A%0A' +
                      '*Name:* ' + encodeURIComponent(n) + '%0A' +
                      '*Phone:* ' + encodeURIComponent(p) + '%0A' +
                      '*Address:* ' + encodeURIComponent(a) + '%0A' +
                      '*Product:* ' + encodeURIComponent(selectedItem.name) + '%0A' +
                      '*Total:* Rs. ' + selectedItem.price.toLocaleString();
            
            // 🚀 The Absolute Master Protocol Bypass (Forces Native App to Open Target Chat Directly)
            let nativeAppUrl = 'whatsapp://send?phone=923121545628&text=' + txt;
            window.location.href = nativeAppUrl;
        }
    </script>
</body>
</html>
